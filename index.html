<!-- Header -->
<header class="bg-indigo-600 text-white shadow-lg z-20">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">智能行程伴侣</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="app.toggleView('list')" class="hover:bg-indigo-500 p-2 rounded-full transition" title="列表视图"><i class="fa-solid fa-list"></i></button>
            <button onclick="app.toggleView('calendar')" class="hover:bg-indigo-500 p-2 rounded-full transition" title="日历视图"><i class="fa-solid fa-calendar-days"></i></button>
            <button onclick="app.openParserModal()" class="bg-teal-500 hover:bg-teal-600 text-white px-3 py-1 rounded-lg text-sm font-semibold shadow transition">
                <i class="fa-solid fa-paste mr-1"></i> 批量导入文本
            </button>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="flex-1 flex overflow-hidden relative">

    <!-- Sidebar: People Filter & Stats -->
    <aside class="w-64 bg-white shadow-md z-10 hidden md:flex flex-col">
        <div class="p-4 border-b border-gray-100">
            <h2 class="font-semibold text-gray-700 mb-3"><i class="fa-solid fa-users mr-2"></i>按人员筛选</h2>
            <div id="peopleFilterList" class="space-y-2 max-h-60 overflow-y-auto">
                <!-- Dynamic People Filters -->
            </div>
            <button onclick="app.openAddPersonModal()" class="mt-3 w-full py-2 px-4 border border-dashed border-indigo-300 text-indigo-600 rounded hover:bg-indigo-50 transition text-sm">
                <i class="fa-solid fa-plus mr-1"></i> 添加联系人
            </button>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <h2 class="font-semibold text-gray-700 mb-3"><i class="fa-solid fa-chart-pie mr-2"></i>行程统计</h2>
            <canvas id="statsChart"></canvas>
        </div>
    </aside>

    <!-- Center: Calendar / List View -->
    <section class="flex-1 flex flex-col bg-gray-50 relative overflow-hidden">

        <!-- Toolbar -->
        <div class="bg-white p-4 shadow-sm flex justify-between items-center z-10">
            <div class="flex items-center space-x-4">
                <button onclick="app.changeMonth(-1)" class="text-gray-500 hover:text-indigo-600"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="currentMonthDisplay" class="text-lg font-bold text-gray-800">2026年 9月</h2>
                <button onclick="app.changeMonth(1)" class="text-gray-500 hover:text-indigo-600"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="flex space-x-2">
                <input type="text" id="searchInput" placeholder="搜索行程..." class="border border-gray-300 rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="app.openAddEventModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow transition flex items-center">
                    <i class="fa-solid fa-plus mr-2"></i> 新建行程
                </button>
            </div>
        </div>

        <!-- Calendar Grid Container -->
        <div id="calendarView" class="flex-1 overflow-y-auto p-4 fade-in">
            <div class="grid grid-cols-7 gap-px bg-gray-200 border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                <!-- Weekday Headers -->
                <div class="bg-gray-50 p-2 text-center text-xs font-semibold text-gray-500 uppercase">周日</div>
                <div class="bg-gray-50 p-2 text-center text-xs font-semibold text-gray-500 uppercase">周一</div>
                <div class="bg-gray-50 p-2 text-center text-xs font-semibold text-gray-500 uppercase">周二</div>
                <div class="bg-gray-50 p-2 text-center text-xs font-semibold text-gray-500 uppercase">周三</div>
                <div class="bg-gray-50 p-2 text-center text-xs font-semibold text-gray-500 uppercase">周四</div>
                <div class="bg-gray-50 p-2 text-center text-xs font-semibold text-gray-500 uppercase">周五</div>
                <div class="bg-gray-50 p-2 text-center text-xs font-semibold text-gray-500 uppercase">周六</div>

                <!-- Days will be injected here -->
                <div id="calendarDays" class="contents"></div>
            </div>
        </div>

        <!-- List View Container (Hidden by default) -->
        <div id="listView" class="hidden flex-1 overflow-y-auto p-4 fade-in">
            <div id="eventListContainer" class="space-y-3 max-w-3xl mx-auto">
                <!-- Event Cards will be injected here -->
            </div>
        </div>

    </section>
</main>

<!-- Modal: Text Parser (New Feature) -->
<div id="parserModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden transform transition-all scale-100 flex flex-col max-h-[90vh]">
        <div class="bg-teal-600 px-6 py-4 flex justify-between items-center shrink-0">
            <h3 class="text-white font-bold text-lg"><i class="fa-solid fa-robot mr-2"></i>智能文本解析</h3>
            <button onclick="app.closeModal('parserModal')" class="text-white hover:text-gray-200"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto">
            <p class="text-sm text-gray-600 mb-2">请粘贴包含会议安排的长文本，系统将自动识别时间、人物和事件。</p>
            <textarea id="parseInput" rows="8" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none font-mono text-sm" placeholder="例如：&#10;9月25日下午3点和张三开会讨论项目&#10;明天上午10点和李四健身&#10;下周一晚上7点和王五吃饭"></textarea>

            <div id="parsePreview" class="mt-4 hidden">
                <h4 class="font-semibold text-gray-700 mb-2">解析预览：</h4>
                <div id="previewList" class="space-y-2 max-h-40 overflow-y-auto border rounded p-2 bg-gray-50"></div>
            </div>
        </div>
        <div class="p-4 border-t border-gray-100 flex justify-end space-x-3 shrink-0 bg-gray-50">
            <button type="button" onclick="app.previewParse()" class="px-4 py-2 text-teal-600 hover:bg-teal-50 rounded-lg transition border border-teal-200">预览解析结果</button>
            <button type="button" onclick="app.confirmParseAndSave()" class="px-6 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg shadow transition">确认导入</button>
        </div>
    </div>
</div>

<!-- Modal: Add/Edit Event -->
<div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden transform transition-all scale-100">
        <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center">
            <h3 class="text-white font-bold text-lg" id="modalTitle">新建行程</h3>
            <button onclick="app.closeModal('eventModal')" class="text-white hover:text-gray-200"><i class="fa-solid fa-times"></i></button>
        </div>
        <form id="eventForm" onsubmit="app.saveEvent(event)" class="p-6 space-y-4">
            <input type="hidden" id="eventId">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">行程标题</label>
                <input type="text" id="eventTitle" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">日期</label>
                    <input type="date" id="eventDate" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">时间</label>
                    <input type="time" id="eventTime" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">关联人员</label>
                <select id="eventPerson" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                    <option value="">无特定人员</option>
                    <!-- Options populated dynamically -->
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">提醒设置</label>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="eventReminder" checked class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300">
                    <span class="text-sm text-gray-600">开启提醒</span>
                    <select id="reminderTime" class="ml-2 border border-gray-300 rounded px-2 py-1 text-sm">
                        <option value="0">准时</option>
                        <option value="15" selected>提前15分钟</option>
                        <option value="30">提前30分钟</option>
                        <option value="60">提前1小时</option>
                        <option value="1440">提前1天</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                <textarea id="eventNote" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
            </div>

            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" onclick="app.closeModal('eventModal')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
                <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow transition">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Add Person -->
<div id="personModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
        <div class="bg-teal-600 px-6 py-4 flex justify-between items-center">
            <h3 class="text-white font-bold text-lg">添加联系人</h3>
            <button onclick="app.closeModal('personModal')" class="text-white hover:text-gray-200"><i class="fa-solid fa-times"></i></button>
        </div>
        <form id="personForm" onsubmit="app.savePerson(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                <input type="text" id="personName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">关系/标签</label>
                <input type="text" id="personRelation" placeholder="例如：同事、家人" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 outline-none">
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" onclick="app.closeModal('personModal')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
                <button type="submit" class="px-6 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg shadow transition">添加</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center">
    <i class="fa-solid fa-circle-info mr-3 text-indigo-400"></i>
    <span id="toastMessage">Notification</span>
</div>

<script src="app.js"></script>
